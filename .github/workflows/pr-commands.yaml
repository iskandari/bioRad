# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [feature/sf-terra-migration]
  workflow_dispatch:
    inputs:
      command:
        type: choice
        description: Command to run without pushing changes
        options: [document, style]
        default: document
  issue_comment:
    types: [created]

name: Commands

jobs:
  document:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.command == 'document') || github.event.issue.pull_request && (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER') && startsWith(github.event.comment.body, '/document') }}
    name: document
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/pr-fetch@v2
        if: github.event_name == 'issue_comment'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          needs: pr-document

      - name: Install the documentation generator recorded in DESCRIPTION
        run: |
          version <- read.dcf("DESCRIPTION")[1, "Config/roxygen2/version"]
          if (as.character(utils::packageVersion("roxygen2")) != version) {
            url <- sprintf("https://cloud.r-project.org/src/contrib/Archive/roxygen2/roxygen2_%s.tar.gz", version)
            utils::install.packages(url, repos = NULL, type = "source")
          }
          stopifnot(as.character(utils::packageVersion("roxygen2")) == version)
        shell: Rscript {0}

      - name: Document
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Verify generated documentation
        if: github.event_name != 'issue_comment'
        run: git diff --exit-code -- man NAMESPACE DESCRIPTION

      - name: commit
        if: github.event_name == 'issue_comment'
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add man/\* NAMESPACE
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Document'

      - uses: r-lib/actions/pr-push@v2
        if: github.event_name == 'issue_comment'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  style:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.command == 'style') || github.event.issue.pull_request && (github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'OWNER') && startsWith(github.event.comment.body, '/style') }}
    name: style
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/pr-fetch@v2
        if: github.event_name == 'issue_comment'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: r-lib/actions/setup-r@v2

      - name: Install dependencies
        run: install.packages("styler")
        shell: Rscript {0}

      - name: Style
        run: styler::style_pkg()
        shell: Rscript {0}

      - name: commit
        if: github.event_name == 'issue_comment'
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add \*.R
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Style'

      - uses: r-lib/actions/pr-push@v2
        if: github.event_name == 'issue_comment'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
